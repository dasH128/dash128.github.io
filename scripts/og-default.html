<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tarjeta de previsualización (1200x630)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Geist+Mono:wght@500&family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
<style>
  /* FUENTE de public/og/default.jpg. Para regenerarla: copiar este archivo a public/_tmp-og.html, abrir
     http://localhost:4321/_tmp-og.html con `astro dev`, capturar la region 0,0 a 1200,630 (sin el
     puntero del raton dentro), convertir a JPG (calidad ~86) y borrar la copia de public/.
     Una por idioma: ?lang=en -> public/og/en.jpg, ?lang=es -> public/og/es.jpg. */
  /* La imagen que sale en WhatsApp, LinkedIn, X... al compartir el enlace. Se captura a 1200x630.
     Margen de seguridad de 64 px: algunas apps recortan los bordes. */
  :root{--paper:#f4f1e8;--ink:#14130f;--ink-soft:#5a564c;--blue:#2342e8}
  *{box-sizing:border-box}
  html,body{margin:0;background:#888}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;background:var(--paper);color:var(--ink)}

  .logo{position:absolute;left:64px;top:44px;font-family:"Nothing You Could Do",cursive;font-size:60px;line-height:1;color:var(--blue);transform:rotate(-4deg);transform-origin:left}
  .logo span{color:var(--ink)}

  .name{position:absolute;left:64px;top:150px;font-family:Anton,Impact,sans-serif;text-transform:uppercase;font-size:136px;line-height:.9;letter-spacing:.005em;margin:0}
  .name span{display:block}
  .name .b{color:var(--blue)}

  .role{position:absolute;left:68px;top:432px;font-family:"Geist Mono",monospace;font-weight:500;font-size:27px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}

  .pills{position:absolute;left:64px;top:496px;display:flex;gap:16px}
  .pill{font-family:"Geist Mono",monospace;font-weight:500;font-size:22px;letter-spacing:.05em;text-transform:uppercase;padding:.55em 1.15em;border-radius:99px;border:2.5px solid var(--ink);background:var(--paper);white-space:nowrap}
  .pill--blue{background:var(--blue);border-color:var(--blue);color:#fff}

  .scribble{position:absolute;left:760px;top:20px;width:420px;height:620px;overflow:visible}
  .scribble path{fill:none;stroke:var(--blue);stroke-width:4;stroke-linecap:round}
  .me{position:absolute;left:712px;bottom:-34px;height:660px;width:auto;
    filter:grayscale(1) contrast(1.08) drop-shadow(4px 0 0 var(--paper)) drop-shadow(-4px 0 0 var(--paper)) drop-shadow(0 4px 0 var(--paper)) drop-shadow(0 -4px 0 var(--paper))}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">jordy<span>.</span></div>

  <h1 class="name"><span>Jordy Rojas</span><span class="b">Aliaga</span></h1>
  <div class="role" id="role">Fullstack &amp; Mobile Engineer</div>
  <div class="pills">
    <span class="pill">🇵🇪 Lima ✈ 🇵🇹 Porto</span>
    <span class="pill pill--blue" id="years">8+ years</span>
  </div>

  <svg class="scribble" viewBox="0 0 600 800" preserveAspectRatio="none" aria-hidden="true">
    <path d="M120 60 C 160 200, 80 300, 130 430 S 90 640, 140 790"/>
    <path d="M160 20 C 180 160, 130 260, 170 400 S 150 600, 175 780"/>
    <path d="M470 40 C 440 190, 510 300, 465 430 S 505 620, 460 790"/>
    <path d="M505 90 C 490 220, 530 330, 500 460 S 525 650, 500 770"/>
  </svg>
  <img class="me" id="me" src="/me/jordy.png" alt="">
</div>
<script>
  // Language: ?lang=es or ?lang=en (default). One card per language in public/og/{lang}.jpg.
  const TEXT = { en: { role: "Fullstack & Mobile Engineer", years: "8+ years" }, es: { role: "Ingeniero Fullstack y Mobile", years: "8+ años" } };
  const L = new URLSearchParams(location.search).get("lang") === "es" ? "es" : "en";
  document.getElementById("role").textContent = TEXT[L].role;
  document.getElementById("years").textContent = TEXT[L].years;
  // Tells the capture it can go: fonts and photo ready.
  Promise.all([document.fonts.ready, new Promise(r => { const i = document.getElementById("me"); i.complete ? r() : i.onload = r; })])
    .then(() => { document.title = "ready"; });
</script>
</body>
</html>
